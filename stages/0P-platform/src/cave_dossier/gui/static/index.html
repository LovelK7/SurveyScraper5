<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speleo nadzorna ploča</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23EBAF01'/%3E%3Cpath d='M4 19 9.5 7l3 5 2-3L20 19Z' fill='none' stroke='%23191300' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M10.5 19v-2.2a1.5 1.5 0 0 1 3 0V19' fill='none' stroke='%23191300' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>window.CD_TOKEN = "__TOKEN__";</script>
</head>
<body>
<!-- Icon set (24×24, stroke = currentColor). One symbol per Drive folder and
     per stage; app.js uses them via <use href="#i-…">. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Pregled: a cave mouth under a ridge -->
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 20 9 7l3.5 5.5L15 9l6 11Z"/><path d="M10 20v-2.5a2 2 0 0 1 4 0V20"/></symbol>
  <!-- 1T teren: caving helmet with headlamp -->
  <symbol id="i-teren" viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M2.5 16h19"/><rect x="10" y="9" width="4" height="3" rx="1"/><path d="M12 4.5V6M8.5 5.5l.8 1.2M15.5 5.5l-.8 1.2"/></symbol>
  <!-- 2B / Speleo baza: database -->
  <symbol id="i-baza" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/></symbol>
  <!-- the live workbook itself: spreadsheet grid -->
  <symbol id="i-sb" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9h17M3.5 14h17M9 4v16"/></symbol>
  <!-- 4G geo: ridge with a location pin -->
  <symbol id="i-geo" viewBox="0 0 24 24"><path d="M2.5 20 8 12l3.5 4.5 2.5-3 7.5 6.5Z"/><path d="M17 3.5a3 3 0 0 1 3 3c0 2.1-3 5-3 5s-3-2.9-3-5a3 3 0 0 1 3-3Z"/><circle cx="17" cy="6.5" r=".6"/></symbol>
  <!-- 4I isječak karte: folded map -->
  <symbol id="i-karta" viewBox="0 0 24 24"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z"/><path d="M9 4v13.5M15 6.5V20"/></symbol>
  <!-- 4O OSZ: clipboard -->
  <symbol id="i-osz" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2"/><rect x="9" y="2.5" width="6" height="4" rx="1"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4"/></symbol>
  <!-- 3N nacrt: survey compass -->
  <symbol id="i-nacrt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 5.5 2.6 6.5L12 18.5 9.4 12Z"/><path d="M12 2.5v1.5M21.5 12H20M12 21.5V20M2.5 12H4"/></symbol>
  <!-- 4S sastavnica: drawing sheet with its title block -->
  <symbol id="i-sastavnica" viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="17" rx="1.5"/><path d="M11 14.5h10M11 14.5v6M11 17.5h10M16 14.5v3"/><path d="M6 11c1.5-3 3-4.5 5-4.5s3 2 5 1.5"/></symbol>
  <!-- 4F fotografije: camera -->
  <symbol id="i-foto" viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 0 1 2-2h2.5l1.5-2.5h6l1.5 2.5H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.6"/></symbol>
  <!-- photos waiting in the queue: camera + hourglass -->
  <symbol id="i-foto-red" viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 1 2-2h2l1.5-2.5h5L15 7h1"/><path d="M3 9v8.5a2 2 0 0 0 2 2h7"/><circle cx="9.5" cy="13" r="3"/><path d="M15.5 12.5h6M15.5 21h6M16.5 12.5c0 2.5 4 2.8 4 4.25s-4 1.75-4 4.25M20.5 12.5c0 2.5-4 2.8-4 4.25s4 1.75 4 4.25"/></symbol>
  <!-- registar udruga: a flag -->
  <symbol id="i-udruge" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></symbol>
  <!-- 5O osobe: two people -->
  <symbol id="i-osobe" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6A5 5 0 0 1 21.5 19"/></symbol>
  <!-- izjave: pen signing a line -->
  <symbol id="i-izjava" viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 10 19H5v-5Z"/><path d="M12.5 6.5l5 5"/><path d="M3 21.5h18"/></symbol>
  <!-- 5D dosje: folder with a check -->
  <symbol id="i-dosje" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="m8.5 13.5 2.5 2.5 4.5-4.5"/></symbol>
  <!-- 6P predaja: archive box -->
  <symbol id="i-predaja" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/></symbol>
  <!-- Za digitalizirat: intake tray -->
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13.5 6 5h12l3 8.5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 13.5h5l1.2 2.5h5.6l1.2-2.5h5"/></symbol>
  <!-- the Drive root (Speleo baza SUE): cloud folder -->
  <symbol id="i-drive" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 8.6 4.5 4.5 0 0 1 17 18.5Z"/><path d="M9.5 14.5h5"/></symbol>
  <!-- runs/: terminal -->
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17"/></symbol>
  <!-- sb-sync/: sync arrows -->
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4.5 11a7.5 7.5 0 0 1 13-4.6L20 9"/><path d="M20 4v5h-5"/><path d="M19.5 13a7.5 7.5 0 0 1-13 4.6L4 15"/><path d="M4 20v-5h5"/></symbol>
  <!-- ★ Brze radnje -->
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8Z"/></symbol>
  <!-- small UI glyphs -->
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7Z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg class="ico lg"><use href="#i-home"/></svg></span>
    <div>
      <div class="brand-title">Speleo nadzorna ploča</div>
      <div class="brand-sub">SurveyScraper5 · cave-dossier</div>
    </div>
  </div>

  <div class="sb-box">
    <span id="sb-mode" class="badge">SB …</span>
    <button id="btn-open-sb" class="btn primary" title="Otvori živu Speleo bazu u Excelu"><svg class="ico"><use href="#i-sb"/></svg>Otvori SB</button>
  </div>

  <div class="cave-box">
    <label for="cave-input" class="cave-label">Objekt</label>
    <div class="combo">
      <input id="cave-input" placeholder="Redni broj ili ime…" autocomplete="off" role="combobox"
             aria-expanded="false" aria-controls="cave-menu">
      <button id="cave-toggle" class="combo-toggle" tabindex="-1" aria-label="Prikaži sve objekte">▾</button>
      <div id="cave-menu" class="combo-menu" role="listbox" hidden></div>
    </div>
    <button id="btn-cave-folder" class="btn" title="Otvori mapu objekta"><svg class="ico"><use href="#i-folder"/></svg>Mapa</button>
    <button id="btn-cave-clear" class="btn ghost" title="Makni odabir">✕</button>
  </div>

  <button id="btn-refresh" class="btn ghost" title="Ponovno učitaj postavke, SB i mape"><svg class="ico"><use href="#i-refresh"/></svg>Osvježi</button>
</header>

<div class="layout">
  <nav id="nav" class="nav" aria-label="Faze"></nav>
  <main id="main" class="main"></main>
</div>

<section id="console" class="console collapsed" aria-label="Ispis">
  <div class="console-bar">
    <button id="console-toggle" class="console-title"><svg class="ico"><use href="#i-terminal"/></svg><span id="console-arrow">▸</span> Ispis <span id="console-count" class="muted"></span></button>
    <div id="job-tabs" class="job-tabs"></div>
    <div class="console-actions">
      <button id="job-copy" class="btn small ghost" title="Kopiraj naredbu">Kopiraj naredbu</button>
      <button id="job-log" class="btn small ghost" title="Otvori zapis u runs/gui">Zapis</button>
      <button id="job-kill" class="btn small danger">Zaustavi</button>
    </div>
  </div>
  <div class="console-body">
    <pre id="job-output" class="job-output"></pre>
    <form id="job-input-form" class="job-input">
      <span class="prompt">›</span>
      <input id="job-input" placeholder="Odgovor programu (broj, SVE, Enter = prijedlog)…" autocomplete="off">
      <button class="btn small">Pošalji</button>
    </form>
  </div>
</section>

<dialog id="confirm" class="confirm">
  <form method="dialog">
    <h2 id="confirm-title">Potvrdi</h2>
    <p id="confirm-text"></p>
    <code id="confirm-cmd" class="cmd"></code>
    <label class="check" id="confirm-remember-row"><input type="checkbox" id="confirm-remember"> Ne pitaj više – vrijedi za sve radnje (ponovno uključiš na Pregledu)</label>
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost">Odustani</button>
      <button value="ok" class="btn warn" id="confirm-ok">Pokreni</button>
    </div>
  </form>
</dialog>

<dialog id="lightbox" class="lightbox"><img id="lightbox-img" alt=""><p id="lightbox-cap"></p></dialog>

<div id="help-pop" class="qpop" role="dialog" aria-label="Pomoć" hidden></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/help.js"></script>
<script src="/static/app.js"></script>
<script src="/static/mapping.js"></script>
</body>
</html>
