# cave-dossier configuration (committed; per-machine values go in .env).
#
# SB column names seeded from crospeleo-automation profiles/estavela/profile.yaml
# (the same society, the same workbook) — keeping the names identical means SB
# behaves consistently across both tools.

sb:
  # Filename of the live workbook, resolved against LOCAL_DRIVE_ROOT (.env)
  # when SB_WORKBOOK_PATH (sandbox override) is not set.
  workbook_filename: "!Speleo_baza_SUE_v3.0.xlsm"
  sheet_name: "Svi objekti"        # single master table since v3.0 (SO_v2_1, header row 2);
                                   # Istraženi / Nesređeni / Za istražit are Power Query views

  # Column names as they appear in the workbook header row.
  object_name_column: "Ime objekta"
  archive_reference_column: "Katastarski broj SUE"   # the SUE number
  filter_column: "CroSpeleo unos"
  marker_column: "Katastarski broj RH"
  plaque_column: "Broj pločice"
  # Renamed in the live workbook 2026-08-26: the cell holds the survey authors
  # for finished caves, but for queued ones it holds the *source* (who found or
  # reported the cave, often a literature citation) — see column_aliases below.
  drawing_authors_column: "Autori nacrta ili izvor"
  exploration_period_column: "Godina ili period istraživanja"
  x_htrs_column: "X HTRS"
  y_htrs_column: "Y HTRS"

  # Older spellings of the columns above, so one config reads both the live
  # workbook and any older copy (the sandbox, archived exports). Alias -> the
  # canonical name it is renamed to on load; matching is diacritic-insensitive.
  column_aliases:
    "Autori nacrta": "Autori nacrta ili izvor"
    "Autor nacrta": "Autori nacrta ili izvor"

  # Additional columns the DOSSIER reads (M2 on): canonical dossier field ->
  # column header, mirroring crospeleo-automation's profile.sb.field_columns.
  # The nine names above stay separate because SBReader itself needs them
  # (header autodetect + cave lookup). Lookup is diacritic-insensitive.
  field_columns:
    # The cave's identity BEFORE it earns a SUE number (user, 2026-08-26): the
    # pre-SUE ID for intake folders, photo prefixes and any processing step.
    serial_number: "Redni broj"
    synonyms: "Sinonimi"
    locality: "Lokalitet"
    nearest_place: "Najbliže mjesto"
    length_m: "Duljina"
    depth_m: "Dubina"
    entrance_elevation_m: "Z"
    last_exploration_year: "Godina zadnjeg istraživanja"
    note: "Napomena"                       # also carries the "za istražit" queue flag
    entrance_photo_flag: "Fotografija ulaza"
    pollution_flag: "Zagađenost"
    ice_cave_flag: "Ledenica"
    supplementary_record_flag: "Dopunski zapisnik?"
    nacrt_link: "Link Nacrt"
    zapisnik_link: "Link Zapisnik"

# Society archive dirs on Drive (relative to LOCAL_DRIVE_ROOT) — used from M2 on
# (dossier gathering) and M6 (delivery). Same dirs crospeleo-automation reads.
archive:
  osz_dir: "!!Osnovni zapisnici"
  drawings_dir: "!!Nacrti"
  statements_dir: "!!Izjave za katastar RH"
  entry_photos_dir: "!!Fotografije ulaza"
  # Staging queue for caves that have no SUE number yet — free-form filenames,
  # to be prefixed with Redni broj (2.1d). NOT a permanent photo repository:
  # photos move up into entry_photos_dir, renamed to the SUE number, once the
  # cave earns one.
  queued_photos_dir: "!!Fotografije ulaza/!!Fotografije ulaza za istražit"

  # Field-data intake (M2): raw material per cave before anything is filed.
  # Leaf folders here get a Redni broj prefix — see cave_dossier/intake/.
  intake_dir: "!!!Digitalizacija/!Za digitalizirat"

# Field-data intake mapping (user, 2026-08-28/29). Folder fragment -> Redni broj
# for leaves the name matcher cannot resolve, and the folders confirmed to hold
# data for caves that are NOT in SB yet.
intake:
  manual_matches:
    "Bilova ponikva": 976          # SB spells it "Billova ponikva"
    "Golobreška nanoekspedicija": 1103   # SB: "Golobreška mikroekspedicija"
    "Krater_CL": 1226              # SB: "Jama Krater u dolcima"
    "Eugenov Dalekovod": 1174      # SB: "Jama pod dalekovodom"
    "M.Dol Pećina": 1272           # SB: "Pećina u Mudnoj doli"

  # Confirmed NOT in SB. Every unresolved leaf is a new entry by default (user,
  # 2026-08-29), so this list is only needed to OVERRIDE a wrong automatic match:
  # Božur_Frustuck resembles "Božur" (1087) but is a different, new cave.
  new_entries:
    - "Božur_Frustuck"
    - "Ona je glonđa"
    - "Špilja M.Dol"

# Part 2.1d — entrance-photo processing spec (user, 2026-08-26).
# Field photos arrive at 7 MB+; the manual workflow is FastStone Image Viewer
# "resize to screen size", which lands around 1 MB. These are the targets the
# 2.1d processor will aim for; the gate only WARNS above
# gating.MAX_ENTRANCE_PHOTO_BYTES (2 MB), it never blocks on photo size.
photos:
  target_long_edge_px: 1920
  target_max_bytes: 1500000

  # Staged photos the automatic evidence (plaque / name / old queue broj) cannot
  # reach: filename fragment -> Redni broj. Supplied by the user 2026-08-26.
  manual_matches:
    "Jama GB 1": 812              # GB = Goli breg; SB name is "Goli breg 1"
    "Jamica smeća kod Knezgrada": 884   # SB spells it "Jamica sa smećem kod Knezgrada"
    "Ponor Prijeboj": 1185          # SB name is "Ponor kraj Prijeboja"; its Napomena even says "fotke br 605"
    "rubinija": 1214                # filename transposes it; SB name is "Rubijina jama"
