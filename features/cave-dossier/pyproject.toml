[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-dossier"
version = "0.1.0"
description = "SurveyScraper5 stage 2: SB (Speleo baza) communication + cave dossier builder (parts 2.1, 2.1b, 2.1c, 2.2)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Writes to the live SB workbook (Excel COM; Windows + Excel only) — M6
sb-write = ["xlwings>=0.30"]
# Isječak karte (georef.hr headed browser flow) — M3
karta = ["playwright>=1.40", "Pillow>=10"]
# OSZ DOCX builder — M4. lxml directly, NOT python-docx: the template's w:sdt
# content controls are invisible to python-docx, so every OSZ tool (the
# osz-template workbench included) works on word/document.xml through lxml.
osz = ["lxml>=4.9"]
# Locality + elevation finders (part 2.1b prefill) — RGI WFS, DGU admin
# boundaries, INSPIRE EL-COV sampling. All imports are lazy: the base install
# works without this extra, the finders just report "unavailable".
geo = [
    "requests>=2.31",
    "geopandas>=0.14",
    "shapely>=2",
    "pyproj>=3.6",
    "rapidfuzz>=3",
    "rasterio>=1.3",
]

[project.scripts]
cavedossier = "cave_dossier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
