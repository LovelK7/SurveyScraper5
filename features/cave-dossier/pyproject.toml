[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-dossier"
version = "0.1.0"
description = "SurveyScraper5 stage 2: SB (Speleo baza) communication + cave dossier builder (parts 2.1, 2.1b, 2.1c, 2.2)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Writes to the live SB workbook (Excel COM; Windows + Excel only) — M6
sb-write = ["xlwings>=0.30"]
# Isječak karte (georef.hr headed browser flow) — M3
karta = ["playwright>=1.40", "Pillow>=10"]
# OSZ DOCX builder — M4
osz = ["python-docx>=1.1"]

[project.scripts]
cavedossier = "cave_dossier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
